spring:
  application:
    name: FriendCircle

  servlet:
    multipart:
      #最大单个文件大小
      max-file-size: 10MB
      #最大请求大小（所有文件）
      max-request-size: 100MB

  #MongoDB数据源配置
  mongodb:
        # 主机地址
    host: 127.0.0.1
        # 数据库
    database: friend-circle
        # 默认端口是27017
    port: 27017
        
  data:
    mongodb:
      field-naming-strategy: org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy

#配置事务管理日志级别
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

#阿里云oss
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: vesper-study-java
    region: cn-beijing
